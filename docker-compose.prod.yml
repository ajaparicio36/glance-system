services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glance
      POSTGRES_USER: glance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - glance_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glance -d glance"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  server:
    build:
      context: .
      dockerfile: glance-server/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private db service}
      DEVICE_ID: ${DEVICE_ID:?Set DEVICE_ID}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN}
      OWNER_TOKEN: ${OWNER_TOKEN:?Set OWNER_TOKEN}
      TRANSPORT_MODE: https-proxy
      TRUSTED_PROXY: ${TRUSTED_PROXY:?Set exact reverse proxy IP}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  glance_prod_db:

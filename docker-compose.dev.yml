services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glance
      POSTGRES_USER: glance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - glance_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glance -d glance"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  glance_dev_db:
